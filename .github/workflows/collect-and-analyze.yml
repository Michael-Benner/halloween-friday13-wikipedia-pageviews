name: Collect and analyze Wikipedia pageviews

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and clean Wikimedia pageviews
        run: python collect_and_clean.py
      - name: Analyze event-day comparisons
        run: python analyze_pageviews.py
      - name: Commit shareable outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/cleaned_sample.csv data/collection_metadata.txt data/category_summary.csv data/event_comparisons.csv figures/event_pageview_changes.png
          git diff --cached --quiet || (git commit -m "Add collected pageview sample and analysis results" && git push)
